<!DOCTYPE html>
<html>
<head>
  <title>SoCal Bite AI Test</title>
</head>
<body>

<h2>Ask The Bite</h2>

<input
  id="question"
  style="width:500px"
  value="Where should I fish today?"
  placeholder="Where should I fish today?">

<button id="askBtn">Ask</button>

<pre id="answer">Waiting...</pre>

<script>
const WORKER_URL = "https://socal-bite-ai-v2.tail-gang-est-2026.workers.dev";

document.getElementById("askBtn").addEventListener("click", askAI);

async function askAI() {
  const answerBox = document.getElementById("answer");
  const question = document.getElementById("question").value.trim();

  answerBox.textContent = "Asking AI...";

  try {
    const response = await fetch(WORKER_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ question })
    });

    const text = await response.text();

    answerBox.textContent =
      "Status: " + response.status + "\n\n" + text;

  } catch (error) {
    answerBox.textContent =
      "Browser error:\n\n" + error.message;
  }
}
</script>

</body>
</html>
