<!DOCTYPE html>
<html>
<head>
    <title>SoCal Bite AI Test</title>
</head>
<body>

<h2>Ask The Bite</h2>

<input
    id="question"
    style="width:500px"
    placeholder="Where should I fish today?">

<button onclick="askAI()">
    Ask
</button>

<pre id="answer"></pre>

<script>
async function askAI(){

    const question =
        document.getElementById("question").value;

    const response = await fetch(
        "https://socal-bite-ai.tail-gang-est-2026.workers.dev",
        {
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify({
                question
            })
        }
    );

    const json = await response.json();

    document.getElementById("answer").textContent =
        JSON.stringify(json,null,2);
}
</script>

</body>
</html>
