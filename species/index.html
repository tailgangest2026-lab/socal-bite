<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Species Analytics | The SoCal Bite</title>
  <meta name="description" content="Southern California species fishing analytics by total catch, fish-per-angler, trips, anglers, and region." />

  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://thesocalbite.com/species" />
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/species.css">
  <link rel="stylesheet" href="../css/forms.css">
  
</head>

<body>
 <div id="site-header"></div>
  <main>
    <section class="species-hero">
      <span class="page-kicker">Species Analytics</span>
      <h1>What’s biting, where it’s biting.</h1>
      <p>
        Catch data by species, region, total fish landed, trips, anglers, and fish-per-angler.
      </p>

      <div class="species-controls">
        <select id="speciesRegion">
          <option value="all">All regions</option>
        </select>

        <select id="speciesDateRange">
          <option value="today" selected>Today</option>
          <option value="yesterday">Previous Day</option>
          <option value="week">Current Week</option>
          <option value="month">Current Month</option>
          <option value="prevMonth">Previous Month</option>
          <option value="custom">Custom Range</option>
        </select>

        <div id="speciesCustomDateRange" class="custom-date-range hidden">
          <input type="date" id="speciesStartDate" />
          <span>to</span>
          <input type="date" id="speciesEndDate" />
        </div>
      </div>
    </section>

    <section id="speciesGrid" class="species-grid">
      <div class="loading-card">Loading species analytics...</div>
    </section>

    <section class="species-cta">
      <a href="../forecast/index.html" class="species-cta-button">
        See species in the forecast
      </a>
    </section>
  </main>

 <div id="site-footer"></div>

  <script src="../site-config.js"></script>
   <script src="../js/layout.js"></script>
  <script src="species.js?v=loveable-species-3"></script>
</body>
</html>
